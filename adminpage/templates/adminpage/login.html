<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | ExploreWorld</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #087f8c,
                    #00a896
                );

            font-family: Arial, sans-serif;

        }


        .login-wrapper {

            width: 100%;

            max-width: 450px;

            padding: 20px;

        }


        .login-card {

            background: rgba(255,255,255,.96);

            border: none;

            border-radius: 25px;

            padding: 40px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.20);

        }


        .logo {

            width: 70px;

            height: 70px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 20px;

            background:
                linear-gradient(
                    135deg,
                    #087f8c,
                    #00a896
                );

            color: white;

            font-size: 30px;

        }


        .login-title {

            font-weight: 800;

            color: #111827;

        }


        .login-subtitle {

            color: #6b7280;

            font-size: 14px;

        }


        .form-control {

            border-radius: 12px;

            padding: 13px 15px;

            border: 1px solid #dee2e6;

        }


        .form-control:focus {

            border-color: #00a896;

            box-shadow:
                0 0 0 3px
                rgba(0,168,150,.12);

        }


        .input-group-text {

            background: white;

            border-radius: 12px 0 0 12px;

            border-right: none;

        }


        .input-group .form-control {

            border-left: none;

            border-radius: 0 12px 12px 0;

        }


        .login-btn {

            width: 100%;

            border: none;

            border-radius: 50px;

            padding: 14px;

            font-weight: 700;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #087f8c,
                    #00a896
                );

            transition: .25s;

        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0,168,150,.3);

            color: white;

        }


        .admin-badge {

            display: inline-block;

            padding: 7px 15px;

            border-radius: 50px;

            background: rgba(0,168,150,.1);

            color: #087f8c;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 15px;

        }


        .back-link {

            color: #087f8c;

            text-decoration: none;

            font-size: 14px;

        }


        .back-link:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


<div class="login-wrapper">

    <div class="login-card">


        <!-- Logo -->

        <div class="logo">

            <i class="bi bi-compass"></i>

        </div>


        <div class="text-center">

            <span class="admin-badge">

                <i class="bi bi-shield-lock me-1"></i>

                Admin Portal

            </span>


            <h2 class="login-title">

                Welcome Back

            </h2>


            <p class="login-subtitle mb-4">

                Sign in to manage your tourism platform.

            </p>

        </div>


        <!-- Messages -->

        {% if messages %}

            {% for message in messages %}

                <div
                    class="alert alert-danger alert-dismissible fade show"
                    role="alert"
                >

                    <i class="bi bi-exclamation-circle me-2"></i>

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                    ></button>

                </div>

            {% endfor %}

        {% endif %}


        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}


            <!-- Username -->

            <div class="mb-3">

                <label class="form-label fw-semibold">

                    Username

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="login-btn"
            >

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Sign In to Dashboard

            </button>


        </form>


        <!-- Back -->

        <div class="text-center mt-4">

            <a
                href="{% url 'index' %}"
                class="back-link"
            >

                <i class="bi bi-arrow-left me-1"></i>

                Back to ExploreWorld

            </a>

        </div>


    </div>

</div>


</body>

</html>
