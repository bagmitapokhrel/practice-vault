<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Admin Panel{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .admin-sidebar {

            position: fixed;
            top: 0;
            left: 0;

            width: 260px;
            height: 100vh;

            background: #111827;
            color: white;

            padding: 25px 18px;

            display: flex;
            flex-direction: column;

            overflow-y: auto;

            z-index: 1000;
        }

        /* Logo */

        .sidebar-logo {

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 5px 10px 20px;
        }

        .logo-icon {

            width: 45px;
            height: 45px;

            background: #198754;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .sidebar-logo h5 {

            margin: 0;
            font-weight: 700;
        }

        .sidebar-logo small {

            color: #9ca3af;
        }

        /* Menu */

        .menu-title {

            color: #6b7280;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1px;

            margin: 22px 10px 8px;
        }

        /* Links */

        .sidebar-link {

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 12px 14px;

            margin: 4px 0;

            border-radius: 10px;

            color: #d1d5db;

            text-decoration: none;

            transition: .25s;
        }

        .sidebar-link i {

            font-size: 17px;

            width: 20px;

            text-align: center;
        }

        .sidebar-link:hover {

            background: #1f2937;

            color: white;

            transform: translateX(3px);
        }

        .sidebar-link.active {

            background: #198754;

            color: white;

            box-shadow: 0 5px 15px rgba(25, 135, 84, .25);
        }

        /* Bottom */

        .sidebar-bottom {

            margin-top: auto;

            padding-top: 20px;

            border-top: 1px solid #374151;
        }

        .logout-link:hover {

            background: #dc3545;
            color: white;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .admin-main {

            margin-left: 260px;

            min-height: 100vh;

            padding: 40px;
        }

        /* Mobile */

        @media (max-width: 768px) {

            .admin-sidebar {

                width: 220px;
            }

            .admin-main {

                margin-left: 220px;

                padding: 20px;
            }

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- SIDEBAR -->
    {% include "adminpage/sidebar.html" %}


    <!-- MAIN -->
    <main class="admin-main">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
